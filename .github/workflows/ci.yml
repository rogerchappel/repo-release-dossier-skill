name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm install --package-lock=false
      - run: npm run check
      - run: npm test
      - run: npm run smoke
      - name: Validate packed artifact
        run: node scripts/packed-artifact-smoke.js
      - name: Validate exported tree
        run: |
          export_dir="$(mktemp -d)"
          git archive HEAD | tar -x -C "$export_dir"
          cd "$export_dir"
          bash scripts/validate.sh
